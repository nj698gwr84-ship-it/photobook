
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>СКАЗКА STUDIO — конструктор детских книг</title>
<style>
:root{
  --bg:#f7f5fb;
  --card:#fff;
  --ink:#272139;
  --muted:#797389;
  --purple:#7753c4;
  --line:#e5dfed;
  --light:#f2edfb;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.layout{
  display:grid;
  grid-template-columns:225px minmax(340px,1fr) minmax(310px,410px);
  min-height:100vh;
}
nav{
  background:#252039;
  color:#fff;
  padding:24px 14px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}
.brand{font:bold 24px Georgia,serif;padding:5px 10px}
.hint{font-size:12px;color:#beb4d2;padding:5px 10px 30px}
.tab{
  width:100%;
  border:1px solid transparent;
  background:transparent;
  color:#e6deef;
  display:block;
  text-align:left;
  padding:14px 12px;
  border-radius:12px;
  margin-bottom:6px;
  font-weight:700;
}
.tab.active{background:#6d51a3;color:#fff}
.tab:hover{background:#6d51a370}
.navbottom{
  font-size:11px;
  color:#b8b0c4;
  margin:40px 10px;
}
main{
  padding:28px clamp(14px,3vw,40px) 70px;
  min-width:0;
}
h1{font:normal 35px Georgia,serif;margin:9px 0}
h2{font-size:17px;margin:0 0 6px}
.sub{
  color:var(--muted);
  font-size:13px;
  margin:0 0 23px;
}
.head{
  display:flex;
  gap:8px;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
}
.tag{
  font-size:11px;
  color:var(--purple);
  font-weight:800;
  letter-spacing:1px;
}
.actions,.buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.btn{
  border:1px solid var(--line);
  background:#fff;
  border-radius:10px;
  padding:10px 13px;
  font-size:12px;
  font-weight:700;
  color:var(--ink);
}
.btn:hover{filter:brightness(.97)}
.primary{
  background:var(--purple);
  border-color:var(--purple);
  color:#fff;
}
.danger{background:#fff0f0;color:#a63248}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:17px;
  padding:19px;
  margin:0 0 17px;
  box-shadow:0 4px 23px #4d33610a;
}
.card>p{
  font-size:12px;
  color:var(--muted);
  margin:0 0 14px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.field{min-width:0}
.field.full{grid-column:1/-1}
.field label{
  display:block;
  font-weight:700;
  font-size:12px;
  margin:0 0 5px;
}
.field input:not([type=checkbox]),
.field select,
.field textarea{
  width:100%;
  min-width:0;
  border:1px solid #dcd5e8;
  border-radius:10px;
  padding:10px 11px;
  color:var(--ink);
  background:#fff;
  outline:0;
}
.field textarea{min-height:92px;resize:vertical}
.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:var(--purple);
  box-shadow:0 0 0 3px #7753c41a;
}
.check{
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:700;
  font-size:12px;
  padding:10px 0;
}
.check input{
  accent-color:var(--purple);
  width:17px;
  height:17px;
}
.item{
  background:#faf8fe;
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
  margin-bottom:11px;
}
.itemhead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:9px;
  margin-bottom:12px;
  font-weight:700;
}
.notice{
  background:var(--light);
  border-radius:12px;
  padding:12px;
  font-size:12px;
  color:#614e8b;
  margin-top:12px;
}
.warning{background:#fff2dc;color:#845314}
.good{background:#eaf8ef;color:#226e45}
.pagebar{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:15px;
}
.pagebtn{
  padding:8px 11px;
  border:1px solid #dcd5e8;
  border-radius:9px;
  background:#fff;
  font-weight:700;
}
.pagebtn.active{color:#fff;background:var(--purple)}
.pagebtn.ok:not(.active){background:#e6f6ed;color:#218052}
.footer{
  display:flex;
  justify-content:space-between;
  gap:9px;
  margin-top:17px;
}
.preview{
  background:#efebf3;
  border-left:1px solid #e2dbe8;
  padding:25px 18px;
  position:sticky;
  top:0;
  height:100vh;
  overflow:auto;
}
.preview pre{
  background:#fff;
  border:1px solid #e2dce9;
  border-radius:12px;
  padding:15px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font:12px/1.65 Consolas,monospace;
  max-height:calc(100vh - 195px);
  min-height:200px;
  overflow:auto;
}
.preview .primary{flex:1}
.small{font-size:11px;color:var(--muted)}
#toast{
  position:fixed;
  bottom:19px;
  left:50%;
  transform:translateX(-50%);
  background:#272139;
  color:#fff;
  padding:11px 18px;
  border-radius:11px;
  z-index:5;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}
#toast.visible{opacity:1}
#upload{display:none}
@media(max-width:1150px){
  .layout{grid-template-columns:200px minmax(0,1fr)}
  .preview{
    grid-column:2;
    position:static;
    height:auto;
    background:none;
    border:0;
    padding:0 25px 30px;
  }
  .preview pre{max-height:420px}
}
@media(max-width:700px){
  .layout{display:block}
  nav{height:auto;position:static;padding:13px}
  .brand{font-size:21px}
  .hint,.navbottom{display:none}
  .navlinks{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;
  }
  .tab{font-size:12px;padding:10px;margin:0}
  main{padding:23px 13px}
  .grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .card{padding:15px}
  h1{font-size:29px}
  .preview{padding:0 13px 28px}
}
</style>
</head>
<body>
<div class="layout">
<nav>
 <div class="brand">📚 СКАЗКА STUDIO</div>
 <div class="hint">Мастерская персональных детских книг</div>
 <div class="navlinks">
  <button class="tab active" data-stage="1">① Персонажи</button>
  <button class="tab" data-stage="2">② Сказка</button>
  <button class="tab" data-stage="3">③ Иллюстрации</button>
  <button class="tab" data-stage="4">④ Печать и PDF</button>
 </div>
 <div class="navbottom">Все настройки сохраняются в этом браузере. Для переноса проекта используйте экспорт JSON.</div>
</nav>
<main>
 <div class="head">
  <span class="tag">КОНСТРУКТОР ПРОМТОВ · 2.0</span>
  <div class="actions">
   <button class="btn" data-action="export">⬇ Проект</button>
   <button class="btn" data-action="import">⬆ Импорт</button>
   <button class="btn danger" data-action="reset">Очистить</button>
   <input id="upload" type="file" accept=".json,application/json">
  </div>
 </div>
 <h1 id="heading"></h1>
 <p class="sub" id="subtitle"></p>
 <div id="form"></div>
 <div class="footer">
  <button class="btn" data-action="prev">← Назад</button>
  <button class="btn primary" data-action="next">Следующий этап →</button>
 </div>
</main>
<aside class="preview">
 <h2>Готовый промт</h2>
 <p class="small">Настройки подставляются автоматически. Утверждённые фото, иллюстрации и файлы приложите в ChatGPT отдельно.</p>
 <pre id="result"></pre>
 <div class="buttons">
  <button class="btn primary" data-action="copy">📋 Копировать промт</button>
  <button class="btn" data-action="txt">TXT</button>
 </div>
 <p id="stats" class="small"></p>
</aside>
</div>
<div id="toast"></div>

<script>

const KEY='skazka_studio_copy_v1';

const $=s=>document.querySelector(s);

const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;',
 '<':'&lt;',
 '>':'&gt;',
 '"':'&quot;',
 "'":'&#39;'
}[c]));

const deepMerge=(base,old)=>{
 if(Array.isArray(base))return Array.isArray(old)?old:base;
 if(!base||typeof base!=='object')
  return old===undefined?base:old;
 if(!old||typeof old!=='object'||Array.isArray(old))
  return base;
 const result={...base};
 for(const k of Object.keys(base))
  result[k]=deepMerge(base[k],old[k]);
 return result;
};

let state=fresh();

try{
 const old=JSON.parse(localStorage.getItem(KEY));
 if(old&&old.book&&old.people&&
    Array.isArray(old.story?.pages)&&old.image&&old.print){
  state=deepMerge(fresh(),old);
  state.story.pages=old.story.pages.map(p=>
   deepMerge(blankPage(),p)
  );
  if(state.print.position!=='Автоматически')
   state.image.textPosition=state.print.position;
  else
   state.print.position=state.image.textPosition;
 }
}catch{}

const val=path=>path.split('.').reduce(
 (obj,key)=>obj?.[key],state
);

function put(path,value){
 const parts=path.split('.');
 let obj=state;
 for(let i=0;i<parts.length-1;i++){
  if(obj[parts[i]]==null)return;
  obj=obj[parts[i]];
 }
 obj[parts[parts.length-1]]=value;
}

function persist(){
 try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}
}

function resizePages(){
 const n=Math.max(
  1,Math.min(40,parseInt(state.story.count,10)||8)
 );
 while(state.story.pages.length<n)
  state.story.pages.push(blankPage());
 state.story.pages.length=n;
 state.currentPage=Math.min(
  Math.max(1,+state.currentPage||1),n
 );
 state.image.page=String(
  Math.min(Math.max(1,+state.image.page||1),n)
 );
 state.print.page=String(
  Math.min(Math.max(1,+state.print.page||1),n)
 );
}

function field(path,label,type='text',options=[],placeholder=''){
 const v=val(path);
 if(type==='check')
  return `<label class="check">
   <input type="checkbox" data-path="${esc(path)}"
   ${v?'checked':''}>${esc(label)}</label>`;

 let html;
 if(type==='select'){
  const opts=[...options];
  if(v!=null&&!opts.some(o=>String(o)===String(v)))
   opts.unshift(String(v));
  html=`<select data-path="${esc(path)}">
  ${opts.map(o=>`<option value="${esc(o)}"
  ${String(o)===String(v)?'selected':''}>
  ${esc(o)}</option>`).join('')}</select>`;
 }else if(type==='area'){
  html=`<textarea data-path="${esc(path)}"
  placeholder="${esc(placeholder)}">${esc(v)}</textarea>`;
 }else{
  html=`<input data-path="${esc(path)}"
   type="${type==='number'?'number':'text'}"
   value="${esc(v)}"
   placeholder="${esc(placeholder)}">`;
 }
 return `<div class="field ${type==='area'?'full':''}">
  <label>${esc(label)}</label>${html}</div>`;
}

const block=(title,description,html)=>`
<section class="card">
<h2>${esc(title)}</h2>
${description?`<p>${esc(description)}</p>`:''}
${html}</section>`;

const grid=(...items)=>`<div class="grid">${items.join('')}</div>`;

const note=(txt,kind='')=>`
<div class="notice ${kind}">${esc(txt)}</div>`;

 return block(

   ...(b.art==='Свой'?
    [field('book.artOwn','Свой стиль')]:[]),

function dimensions(){
 const b=state.book;
 const src=b.size==='Свой'?b.ownSize:b.size;
 const nums=String(src)
  .replace(/,/g,'.')
  .match(/\d+(?:\.\d+)?/g)||[];

 if(nums.length<2)return null;

 let w=+nums[0],h=+nums[1];
 if(!(w>0&&h>0))return null;

 if(b.orientation==='Горизонтальная'&&w<h)
  [w,h]=[h,w];

 if(b.orientation==='Вертикальная'&&w>h)
  [w,h]=[h,w];

 return {w,h};
}

function fontPt(){
 const q=state.print;
 const n=q.fontSize==='Автоматически'
  ?16
  :parseFloat(
    q.fontSize==='Свой размер'
    ?q.fontSizeOwn:q.fontSize
   );
 return Number.isFinite(n)&&n>0?n:16;
}

function fitAnalysis(){
 const p=page(state.print.page);
 const d=dimensions();
 const q=state.print;

 if(!p.text.trim())
  return {
   warning:true,
   text:'Текст страницы не заполнен. Без него нельзя проверить макет.'
  };

 if(!d)
  return {
   warning:true,
   text:'Не указан корректный размер страницы. Проверка вместимости невозможна.'
  };

 const safe=Math.max(0,Number(state.book.safe)||0);
 const pt=fontPt();
 const widthPct=(parseFloat(q.width)||45)/100;
 const heightPct=(parseFloat(q.height)||75)/100;

 const widthPt=(d.w-2*safe)*widthPct*72/25.4;
 const heightPt=(d.h-2*safe)*heightPct*72/25.4;

 const charsPerLine=Math.max(
  8,Math.floor(widthPt/(pt*0.54))
 );

 const paragraphs=p.text.trim().split(/\n+/);

 const lines=paragraphs.reduce(
  (s,t)=>s+Math.max(
   1,Math.ceil(t.length/charsPerLine)
  ),0
 );

 const lineHeight=Math.max(
  1.05,Number(q.lineHeight)||1.3
 );

 const maxLines=Math.floor(
  heightPt/(pt*lineHeight)
 );

 const cramped=lines>maxLines;

 return {
  warning:cramped,
  text:
   `Приблизительная проверка: около ${lines} строк, ориентировочно доступно ${maxLines}. `+
   (cramped
    ?'Вероятен переполненный текстовый блок: увеличь доступную зону, уменьши кегль до допустимого или согласуй разбивку текста.'
    :'По объёму текст может поместиться, но свободное место на самом рисунке необходимо проверить визуально.')
 };
}

function choose(v,own){
 return ['Свой','Своя','Своё','Свои'].includes(v)

function lines(items){
 return items
  .filter(x=>x[1]!==''&&x[1]!=null)
  .map(([k,v])=>`${k}: ${v}`)

function printInfo(){
 const b=state.book;
 const d=dimensions();
 const dpi=Number(b.dpi);
 const bleed=Number(b.bleed);

 let x=lines([
  ['Размер после обрезки',
   d?`${d.w} × ${d.h} мм`
   :(b.size==='Свой'?b.ownSize:b.size)],
  ['Ориентация',b.orientation],
  ['Переплёт',b.binding],
  ['Разрешение',b.dpi+' DPI'],
  ['Вылеты',b.bleed+' мм'],
  ['Безопасные поля',b.safe+' мм'],
  ['Шаблон типографии',
   b.printing?'Будет приложен':'Пока отсутствует']
 ]);

 if(d&&dpi>0&&bleed>=0){
  const w=Math.ceil((d.w+bleed*2)*dpi/25.4);
  const h=Math.ceil((d.h+bleed*2)*dpi/25.4);
  x+=`\nОриентир размера изображения с вылетами: ${w} × ${h} пикселей (без гарантии фактической детализации исходника).`;
 }

 return x;
}

function download(name,data,mime='text/plain;charset=utf-8'){
 const url=URL.createObjectURL(
  new Blob([data],{type:mime})
 );
 const a=document.createElement('a');
 a.href=url;
 a.download=name;
 document.body.appendChild(a);
 a.click();
 a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),2000);
}

async function copy(){
 const t=buildPrompt();

 try{
  await navigator.clipboard.writeText(t);
  toast('Промт скопирован');
 }catch{
  const a=document.createElement('textarea');
  a.value=t;
  a.style.position='fixed';
  a.style.left='-9999px';
  document.body.appendChild(a);
  a.select();

  let ok=false;
  try{ok=document.execCommand('copy')}catch{}
  a.remove();

  toast(
   ok?'Промт скопирован':
   'Браузер запретил копирование. Нажмите TXT.'
  );
 }
}

function parseStory(raw){
 const normalized=String(raw)
  .replace(/\r\n?/g,'\n')
  .replace(
   /^\s*\*\*(СТРАНИЦА[^\n]*?)\*\*\s*$/gim,
   '$1'
  );

 const heads=[...normalized.matchAll(
  /^[ \t]*(?:#{1,4}[ \t]*)?СТРАНИЦА[ \t]*№?[ \t]*(\d{1,2})(?:[ \t]*[—–:-][ \t]*([^\n]*))?[ \t]*$/gim
 )];

 if(!heads.length)return 0;

 let count=0;

 for(let i=0;i<heads.length;i++){
  const n=Number(heads[i][1]);
  if(n<1||n>state.story.pages.length)continue;

  const body=normalized.slice(
   heads[i].index+heads[i][0].length,
   heads[i+1]?.index??normalized.length
  ).trim();

  const marks=[...body.matchAll(
   /^[ \t]*(?:[-*][ \t]+)?(?:\*\*)?(Название эпизода|Текст сказки|Сцена для рисунка|Сцена для иллюстрации)[ \t]*:(?:\*\*)?[ \t]*([^\n]*)/gim
  )];

  const extracted={};

  for(let j=0;j<marks.length;j++){
   const start=marks[j].index+marks[j][0].length;
   const end=marks[j+1]?.index??body.length;
   const label=marks[j][1].toLowerCase();

   const value=(
    marks[j][2]+'\n'+body.slice(start,end)
   ).trim();

   extracted[label]=value;
  }

  const p=state.story.pages[n-1];
  const title=
   extracted['название эпизода']||
   heads[i][2]?.trim();

  const t=extracted['текст сказки'];

  const scene=
   extracted['сцена для рисунка']||
   extracted['сцена для иллюстрации'];

  if(title)
   p.title=title
    .replace(/^\*+|\*+$/g,'')
    .trim();

  if(t!=null)p.text=t;
  if(scene!=null)p.scene=scene;

  if(title||t!=null||scene!=null){
   p.approved=false;
   count++;
  }
 }

 return count;
}

function markUnapproved(path){
 const m=path.match(
  /^story\.pages\.(\d+)\.text$/
 );
 if(!m)return;

 const index=Number(m[1]);

 state.story.pages[index].approved=false;

 const cb=document.querySelector(
  `[data-path="story.pages.${index}.approved"]`
 );

 if(cb)cb.checked=false;

 const btn=document.querySelector(
  `[data-page="${index+1}"]`
 );

 if(btn){
  btn.classList.remove('ok');
  btn.textContent=String(index+1).padStart(2,'0');
 }
}

document.addEventListener('input',e=>{
 const el=e.target;
 const path=el.dataset.path;

 if(!path||
    el.matches('select,input[type="checkbox"]'))
  return;

 put(path,el.value);
 markUnapproved(path);
 persist();
 showPrompt();
});

document.addEventListener('change',e=>{
 const el=e.target;
 const path=el.dataset.path;

 if(path){
  const v=
   el.type==='checkbox'
   ?el.checked:el.value;

  if(path==='story.count'){
   const n=Math.max(
    1,Math.min(40,+v||8)
   );

   if(n<state.story.pages.length&&
      state.story.pages.slice(n).some(
       p=>p.text||p.scene||p.title
      )){
    if(!confirm(
     'При уменьшении числа страниц содержимое последних страниц удалится. Продолжить?'
    )){
     el.value=state.story.count;
     return;
    }
   }
  }

  put(path,v);

  if(path==='image.textPosition')
   state.print.position=v;

  if(path==='print.position')
   state.image.textPosition=v;

  if(path==='story.count')
   resizePages();

  if(path==='story.pages.'+
    (state.currentPage-1)+'.text')
   markUnapproved(path);

  if(el.matches('select,input[type="checkbox"]')){
   render();
  }else{
   persist();
   showPrompt();
  }
 }

 if(el.id==='upload'&&el.files?.[0]){
  const r=new FileReader();

  r.onload=()=>{
   try{
    const o=JSON.parse(r.result);

    if(!o||
       typeof o!=='object'||
       !o.book||
       !o.people||
       !Array.isArray(o.story?.pages)||
       !o.image||
       !o.print)
     throw Error();

    state=deepMerge(fresh(),o);

    state.story.pages=o.story.pages.map(
     p=>deepMerge(blankPage(),p)
    );

    if(state.print.position!=='Автоматически')
     state.image.textPosition=state.print.position;
    else
     state.print.position=state.image.textPosition;

    render();
    toast('Проект загружен');
   }catch{
    toast('Неправильный или повреждённый файл проекта');
   }
  };

  r.readAsText(el.files[0]);
  el.value='';
 }
});

document.addEventListener('click',e=>{
 const b=e.target.closest('button');
 if(!b)return;

 if(b.dataset.stage){
  state.stage=+b.dataset.stage;
  render();
  window.scrollTo(0,0);
  return;
 }

 if(b.dataset.page){
  state.currentPage=+b.dataset.page;
  render();
  return;
 }

 const a=b.dataset.action;
 if(!a)return;

 if(a==='copy'){
  void copy();
  return;
 }

 if(a==='txt'){
  download(
   'ПРОМТ_ЭТАП_'+state.stage+'.txt',
   buildPrompt()
  );
  return;
 }

 if(a==='export'){
  download(
   'СКАЗКА_ПРОЕКТ.json',
   JSON.stringify(state,null,2),
   'application/json;charset=utf-8'
  );
  return;
 }

 if(a==='import'){
  $('#upload').click();
  return;
 }

 if(a==='reset'){
  if(confirm('Удалить все данные текущей книги?')){
   state=fresh();
   render();
   toast('Данные очищены');
  }
  return;
 }

 if(a==='prev'||a==='next'){
  state.stage=Math.max(
   1,Math.min(
    4,state.stage+(a==='next'?1:-1)
   )
  );
  render();
  window.scrollTo(0,0);
  return;
 }

 if(a==='add'){
  const key=b.dataset.list;
  state.people[key].push(
   Array(listFields[key].length).fill('')
  );
  render();
  return;
 }

 if(a==='delete'){
  state.people[b.dataset.list].splice(
   +b.dataset.index,1
  );
  render();
  return;
 }

 if(a==='parse'){
  if(state.story.pages.some(
   p=>p.text||p.scene
  )&&!confirm(
   'Импорт может заменить уже заполненные страницы. Продолжить?'
  ))return;

  const count=parseStory(state.story.paste);

  if(count){
   render();
   toast('Загружено страниц: '+count);
  }else{
   toast('Не найдены заголовки и текст формата «СТРАНИЦА 01»');
  }
 }
});

render();
</script>

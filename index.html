
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>СКАЗКА STUDIO — конструктор детских книг</title>
<style>
:root{--bg:#f7f5fb;--card:#fff;--ink:#272139;--muted:#797389;--purple:#7753c4;--line:#e5dfed;--light:#f2edfb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.layout{display:grid;grid-template-columns:225px minmax(340px,1fr) minmax(310px,410px);min-height:100vh}
nav{background:#252039;color:#fff;padding:24px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font:bold 24px Georgia,serif;padding:5px 10px}
.hint{font-size:12px;color:#beb4d2;padding:5px 10px 30px}
.tab{width:100%;border:1px solid transparent;background:transparent;color:#e6deef;text-align:left;padding:14px 12px;border-radius:12px;margin-bottom:6px;font-weight:700}
.tab.active{background:#6d51a3;color:white}
.tab:hover{background:#6d51a370}
.navbottom{font-size:11px;color:#b8b0c4;margin:40px 10px}
main{padding:28px clamp(14px,3vw,40px) 70px;min-width:0}
h1{font:normal 35px Georgia,serif;margin:9px 0}
h2{font-size:17px;margin:0 0 6px}
.sub{color:var(--muted);font-size:13px;margin:0 0 23px}
.head{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;color:var(--purple);font-weight:800;letter-spacing:1px}
.actions,.buttons{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 13px;font-size:12px;font-weight:700;color:var(--ink)}
.btn:hover{filter:brightness(.97)}
.primary{background:var(--purple);border-color:var(--purple);color:white}
.danger{background:#fff0f0;color:#a63248}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:19px;margin:0 0 17px;box-shadow:0 4px 23px #4d33610a}
.card>p{font-size:12px;color:var(--muted);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{min-width:0}
.field.full{grid-column:1/-1}
.field label{display:block;font-weight:700;font-size:12px;margin:0 0 5px}
.field input:not([type=checkbox]),.field select,.field textarea{width:100%;min-width:0;border:1px solid #dcd5e8;border-radius:10px;padding:10px 11px;color:var(--ink);background:white;outline:0}
.field textarea{min-height:92px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px #7753c41a}
.check{display:flex;align-items:center;gap:9px;font-weight:700;font-size:12px;padding:10px 0}
.check input{accent-color:var(--purple);width:17px;height:17px}
.item{background:#faf8fe;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:11px}
.itemhead{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:12px;font-weight:700}
.notice{background:var(--light);border-radius:12px;padding:12px;font-size:12px;color:#614e8b;margin-top:12px}
.warning{background:#fff2dc;color:#845314}
.good{background:#eaf8ef;color:#226e45}
.pagebar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}
.pagebtn{padding:8px 11px;border:1px solid #dcd5e8;border-radius:9px;background:white;font-weight:700}
.pagebtn.active{color:white;background:var(--purple)}
.pagebtn.ok:not(.active){background:#e6f6ed;color:#218052}
.footer{display:flex;justify-content:space-between;gap:9px;margin-top:17px}
.preview{background:#efebf3;border-left:1px solid #e2dbe8;padding:25px 18px;position:sticky;top:0;height:100vh;overflow:auto}
.preview pre{background:white;border:1px solid #e2dce9;border-radius:12px;padding:15px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.65 Consolas,monospace;max-height:calc(100vh - 195px);min-height:200px;overflow:auto}
.preview .primary{flex:1}
.small{font-size:11px;color:var(--muted)}
#toast{position:fixed;bottom:19px;left:50%;transform:translateX(-50%);background:#272139;color:white;padding:11px 18px;border-radius:11px;z-index:5;opacity:0;pointer-events:none;transition:.2s}
#toast.visible{opacity:1}
#upload{display:none}
.format-info{margin-top:12px;padding:13px;border:1px solid #e3dbf1;background:#faf8ff;border-radius:12px}
.format-info strong{display:block;color:#604194;font-size:14px}
.format-info span{display:block;color:#655d73;font-size:12px;margin-top:4px}
details{margin-top:15px;border:1px solid var(--line);border-radius:12px;padding:12px}
summary{font-weight:700;cursor:pointer}
details .grid{margin-top:14px}
@media(max-width:1150px){
.layout{grid-template-columns:200px minmax(0,1fr)}
.preview{grid-column:2;position:static;height:auto;background:none;border:0;padding:0 25px 30px}

.brand{font-size:21px}
.hint,.navbottom{display:none}
.navlinks{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.tab{font-size:12px;padding:10px;margin:0}
main{padding:23px 13px}
.grid{grid-template-columns:1fr}
.field.full{grid-column:auto}
.card{padding:15px}
h1{font-size:29px}
.preview{padding:0 13px 28px}

  <div class="actions">

  <button class="btn primary" data-action="next">Следующий этап →</button>

</main>
<aside class="preview">

  <button class="btn primary" data-action="copy">📋 Копировать промт</button>
  <button class="btn" data-action="txt">TXT</button>

</aside>
</div>

const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({

}[c]));

function merge(base,old){
 if(Array.isArray(base))
  return Array.isArray(old)?old:base;

 if(!base||typeof base!=='object')
  return old===undefined?base:old;

 if(!old||typeof old!=='object'||Array.isArray(old))
  return base;

 let result={...base};

 for(let k of Object.keys(base))
  result[k]=merge(base[k],old[k]);

 return result;
}

function legacyFormat(book){
 if(FORMATS[book?.format])
  return book.format;

 const original=book?.size==='Свой'
  ?book.ownSize:book?.size;

 const nums=String(original||'')
  .match(/\d+(?:[.,]\d+)?/g)
  ?.slice(0,2)
  .map(v=>Number(v.replace(',','.'))) || [];

 if(nums.length!==2)
  return 'album';

 let [w,h]=nums;

 if(book.orientation==='Горизонтальная'&&h>w)
  [w,h]=[h,w];

 if(book.orientation==='Вертикальная'&&w>h)
  [w,h]=[h,w];

 for(let [key,f] of Object.entries(FORMATS)){
  if(f.w===w&&f.h===h)
   return key;
 }

 return 'album';
}

function normalize(imported){
 if(
  !imported?.book||
  !imported?.people||
  !Array.isArray(imported.story?.pages)||
  !imported?.image||
  !imported?.print
 ){
  throw Error('Неверный формат проекта');
 }

 const next=merge(fresh(),imported);

 next.book.format=legacyFormat(imported.book);

 next.story.pages=imported.story.pages
  .slice(0,40)
  .map(p=>merge(emptyPage(),p));

 if(!next.story.pages.length)
  next.story.pages=[emptyPage()];

 next.story.count=String(next.story.pages.length);

 return next;
}

try{

 if(old)
  state=normalize(old);
}catch{}

function put(path,v){
 const a=path.split('.');
 let o=state;

 for(let i=0;i<a.length-1;i++){
  if(o?.[a[i]]==null)return;
  o=o[a[i]];
 }

 o[a[a.length-1]]=v;
}

function save(){
 try{
  localStorage.setItem(KEY,JSON.stringify(state));
 }catch{}
}

function resizePages(){
 const n=Math.max(
  1,Math.min(40,+state.story.count||8)
 );

 while(state.story.pages.length<n)
  state.story.pages.push(emptyPage());

 state.story.pages.length=n;

 state.currentPage=Math.min(
  n,Math.max(1,+state.currentPage||1)
 );

 state.image.page=String(
  Math.min(n,Math.max(1,+state.image.page||1))
 );

 state.print.page=String(
  Math.min(n,Math.max(1,+state.print.page||1))
 );
}

function field(
 path,label,type='text',options=[],placeholder=''
){
 const v=val(path);

 if(type==='check'){
  return `<label class="check">
   <input type="checkbox"
    data-path="${esc(path)}"
    ${v?'checked':''}>
   ${esc(label)}
   </label>`;
 }

 let html='';

 if(type==='select'){
  const opts=options.map(o=>
   typeof o==='object'
   ?o
   :{value:o,label:o}
  );

  if(v!=null&&!opts.some(o=>
   String(o.value)===String(v)
  )){
   opts.unshift({value:v,label:String(v)});
  }

  html=`<select data-path="${esc(path)}">
   ${opts.map(o=>`
    <option value="${esc(o.value)}"
    ${String(v)===String(o.value)?'selected':''}>
    ${esc(o.label)}
    </option>
   `).join('')}
   </select>`;
 }else if(type==='area'){
  html=`<textarea
   data-path="${esc(path)}"
   placeholder="${esc(placeholder)}"
   >${esc(v)}</textarea>`;
 }else{
  html=`<input
   type="${type==='number'?'number':'text'}"
   data-path="${esc(path)}"
   value="${esc(v)}"
   placeholder="${esc(placeholder)}">`;
 }

 return `<div class="field ${type==='area'?'full':''}">
  <label>${esc(label)}</label>${html}
  </div>`;
}

function layoutSize(){
 const q=state.print;

 const areas={
  'Компактная':[0.36,0.60],
  'Сбалансированная':[0.50,0.75],
  'Просторная':[0.62,0.85]
 };

function fontPt(){
 const q=state.print;

 const n=q.fontSize==='Автоматически'
  ?16
  :parseFloat(
    q.fontSize==='Свой размер'
     ?q.fontSizeOwn
     :q.fontSize
   );

 return Number.isFinite(n)&&n>0?n:16;
}

function fitAnalysis(){
 let p=page(state.print.page);
 let f=selectedFormat();
 let q=state.print;

 if(!p.text.trim()){
  return {
   warning:true,
   text:'Текст страницы не заполнен.'
  };
 }

 const [wf,hf]=layoutSize();

 const wPt=Math.max(0,f.w-2*SAFE)*wf*72/25.4;
 const hPt=Math.max(0,f.h-2*SAFE)*hf*72/25.4;

 const pt=fontPt();

 const chars=Math.max(
  8,Math.floor(wPt/(pt*0.54))
 );

 const l=p.text.trim().split(/\n+/).reduce(
  (sum,t)=>sum+
   Math.max(1,Math.ceil(t.length/chars)),
  0
 );

 const available=Math.floor(
  hPt/(pt*(+q.lineHeight||1.3))
 );

 return {
  warning:l>available,
  text:
   `Приблизительно ${l} строк при доступных ${available}. `+
   (l>available
    ?'Текст может не поместиться: согласуй композицию или объём.'
    :'Объём допустим предварительно; реальную иллюстрацию нужно проверить отдельно.')
 };
}

function aspect(w,h){
 const gcd=(a,b)=>b?gcd(b,a%b):a;
 const g=gcd(w,h);
 return `${w/g}:${h/g}`;
}

function targetPixels(){
 const f=selectedFormat();

 return {
  w:Math.ceil((f.w+2*BLEED)*DPI/25.4),
  h:Math.ceil((f.h+2*BLEED)*DPI/25.4)
 };
}

function formatInfo(){
 const f=selectedFormat();
 const px=targetPixels();

 return `ЕДИНЫЙ ФОРМАТ КНИГИ: ${f.label}
Размер готовой страницы: ${f.w} × ${f.h} мм; пропорции страницы ${aspect(f.w,f.h)} (${(f.w/f.h).toFixed(4)}:1).
Полный фон с предварительными вылетами по ${BLEED} мм: ${f.w+2*BLEED} × ${f.h+2*BLEED} мм; его пропорции ${((f.w+2*BLEED)/(f.h+2*BLEED)).toFixed(4)}:1.
Ориентир растрового размера при ${DPI} DPI: ${px.w} × ${px.h} пикселей, если инструмент поддерживает такую подготовку. Безопасная зона для текста: предварительно ${SAFE} мм от линии обрезки.
Переплёт: ${state.book.binding}. Шаблон типографии: ${state.book.printing?'будет приложен':'пока отсутствует'}.

Применяй ОДИН И ТОТ ЖЕ выбранный формат во всех иллюстрациях, титуле, оглавлении, внутренних страницах и сборке.

Не возвращайся к 16:9 или другому стандартному соотношению по умолчанию.

ВЫЛЕТЫ относятся к фону, а НЕ к отступам под текст.

При несовпадении исходных пропорций дорисовывай недостающий фон (outpainting), не растягивай и не сжимай объекты, не обрезай персонажей, не создавай размытых или белых полос.

 save();
}

let toastTimer;

function toast(s){
 const e=$('#toast');
 e.textContent=s;
 e.classList.add('visible');

 clearTimeout(toastTimer);

 toastTimer=setTimeout(
  ()=>e.classList.remove('visible'),
  2300
 );
}

function download(
 name,data,mime='text/plain;charset=utf-8'
){
 let url=URL.createObjectURL(
  new Blob([data],{type:mime})
 );

 let a=document.createElement('a');
 a.href=url;
 a.download=name;

 document.body.appendChild(a);
 a.click();
 a.remove();

 setTimeout(()=>URL.revokeObjectURL(url),1500);
}

async function copy(){
 let t=buildPrompt();

 try{
  await navigator.clipboard.writeText(t);
  toast('Промт скопирован');
 }catch{
  let a=document.createElement('textarea');
  a.value=t;
  a.style.position='fixed';
  a.style.left='-9999px';

  document.body.appendChild(a);
  a.select();

  let ok=false;

  try{
   ok=document.execCommand('copy');
  }catch{}

  a.remove();

  toast(
   ok
    ?'Промт скопирован'
    :'Копирование недоступно. Используйте TXT.'
  );
 }
}

function parseStory(raw){
 const text=String(raw)
  .replace(/\r\n?/g,'\n')
  .replace(
   /^\s*\*\*(СТРАНИЦА[^\n]*?)\*\*\s*$/gim,
   '$1'
  );

 const heads=[...text.matchAll(
  /^[ \t]*(?:#{1,4}[ \t]*)?СТРАНИЦА[ \t]*№?[ \t]*(\d{1,2})(?:[ \t]*[—–:-][ \t]*([^\n]*))?[ \t]*$/gim
 )];

 let count=0;

 if(!heads.length)return 0;

 for(let i=0;i<heads.length;i++){
  let n=+heads[i][1];

  if(n<1||n>state.story.pages.length)
   continue;

  let body=text.slice(
   heads[i].index+heads[i][0].length,
   heads[i+1]?.index??text.length
  ).trim();

  let marks=[...body.matchAll(
   /^[ \t]*(?:[-*][ \t]+)?(?:\*\*)?(Название эпизода|Текст сказки|Сцена для рисунка|Сцена для иллюстрации)[ \t]*:(?:\*\*)?[ \t]*([^\n]*)/gim
  )];

  let parts={};

  for(let j=0;j<marks.length;j++){
   let start=marks[j].index+marks[j][0].length;

   let end=marks[j+1]?.index??body.length;

   parts[marks[j][1].toLowerCase()]=(
    marks[j][2]+'\n'+body.slice(start,end)
   ).trim();
  }

  let p=state.story.pages[n-1];

  let title=
   parts['название эпизода']||
   heads[i][2]?.trim();

  let story=parts['текст сказки'];

  let scene=
   parts['сцена для рисунка']||
   parts['сцена для иллюстрации'];

  if(title){
   p.title=title
    .replace(/^\*+|\*+$/g,'')
    .trim();
  }

  if(story!=null)
   p.text=story;

  if(scene!=null)
   p.scene=scene;

  if(title||story!=null||scene!=null){
   p.approved=false;
   count++;
  }
 }

 return count;
}

function markUnapproved(path){
 const m=path.match(
  /^story\.pages\.(\d+)\.text$/
 );

 if(!m)return;

 const idx=+m[1];

 state.story.pages[idx].approved=false;

 const cb=document.querySelector(
  `[data-path="story.pages.${idx}.approved"]`
 );

 if(cb)cb.checked=false;

 const btn=document.querySelector(
  `[data-page="${idx+1}"]`
 );

 if(btn){
  btn.classList.remove('ok');
  btn.textContent=String(idx+1).padStart(2,'0');
 }
}

document.addEventListener('input',e=>{
 const el=e.target;
 const path=el.dataset.path;

 if(
  !path||
  el.matches('select,input[type="checkbox"]')
 ){
  return;
 }

 put(path,el.value);
 markUnapproved(path);
 save();
 showPrompt();
});

document.addEventListener('change',e=>{
 const el=e.target;
 const path=el.dataset.path;

 if(path){
  let v=el.type==='checkbox'
   ?el.checked
   :el.value;

  if(path==='story.count'){
   const n=Math.max(
    1,Math.min(40,+v||8)
   );

   if(
    n<state.story.pages.length&&
    state.story.pages.slice(n).some(
     p=>p.text||p.scene||p.title
    )&&
    !confirm(
     'При уменьшении числа страниц данные последних страниц удалятся. Продолжить?'
    )
   ){
    el.value=state.story.count;
    return;
   }
  }

  put(path,v);

  if(path==='image.textPosition')
   state.print.position=v;

  if(path==='print.position')
   state.image.textPosition=v;

  if(path==='story.count')
   resizePages();

  markUnapproved(path);

  if(el.matches('select,input[type="checkbox"]')){
   render();
  }else{
   save();
   showPrompt();
  }
 }

 if(el.id==='upload'&&el.files?.[0]){
  let reader=new FileReader();

  reader.onload=()=>{
   try{
    state=normalize(JSON.parse(reader.result));
    render();
    toast('Проект загружен');
   }catch{
    toast('Ошибка файла проекта');
   }
  };

  reader.readAsText(el.files[0]);
  el.value='';
 }
});

document.addEventListener('click',e=>{
 const b=e.target.closest('button');
 if(!b)return;

 if(b.dataset.stage){
  state.stage=+b.dataset.stage;
  render();
  window.scrollTo(0,0);
  return;
 }

 if(b.dataset.page){
  state.currentPage=+b.dataset.page;
  render();
  return;
 }

 const a=b.dataset.action;
 if(!a)return;

 if(a==='copy'){
  void copy();
  return;
 }

 if(a==='txt'){
  download(
   'ПРОМТ_ЭТАП_'+state.stage+'.txt',
   buildPrompt()
  );
  return;
 }

 if(a==='export'){
  download(
   'СКАЗКА_ПРОЕКТ.json',
   JSON.stringify(state,null,2),
   'application/json;charset=utf-8'
  );
  return;
 }

 if(a==='import'){
  $('#upload').click();
  return;
 }

 if(a==='reset'){
  if(confirm('Удалить все данные текущей книги?')){
   state=fresh();
   render();
   toast('Данные очищены');
  }
  return;
 }

 if(a==='prev'||a==='next'){
  state.stage=Math.max(
   1,
   Math.min(
    4,
    state.stage+(a==='next'?1:-1)
   )
  );

  render();
  window.scrollTo(0,0);
  return;
 }

 if(a==='add'){
  let key=b.dataset.list;

  state.people[key].push(
   Array(listFields[key].length).fill('')
  );

  render();
  return;
 }

 if(a==='delete'){
  state.people[b.dataset.list].splice(
   +b.dataset.index,1
  );

  render();
  return;
 }

 if(a==='parse'){
  if(
   state.story.pages.some(
    p=>p.text||p.scene
   )&&
   !confirm(
    'Импорт может заменить тексты уже заполненных страниц. Продолжить?'
   )
  ){
   return;
  }

  let count=parseStory(state.story.paste);

  if(count){
   render();
   toast('Загружено страниц: '+count);
  }else{
   toast('Не найдено «СТРАНИЦА 01»');
  }
 }
});

render();
</script>

</html>
